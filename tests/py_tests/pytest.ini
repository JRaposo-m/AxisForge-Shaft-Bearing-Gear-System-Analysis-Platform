; AxisForge -- pytest configuration
;
; Place this file at the REPOSITORY ROOT (next to the axisforge/ package),
; not inside tests/. It is what makes `pytest` discoverable from anywhere in
; the repo and what fixes rootdir.
;
; If you already use pyproject.toml, move these settings into a
; [tool.pytest.ini_options] table there instead and delete this file --
; having both is a silent source of "why is my config ignored".

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; importlib mode: test modules are imported by path, so tests/ needs no
; __init__.py files and two test modules may share a basename.
addopts =
    --import-mode=importlib
    --strict-markers
    --strict-config
    -ra

; xfail(strict=True) is used deliberately in this suite to pin known
; discrepancies (see tests/README.md). Making strict the default keeps a
; forgotten marker from silently hiding a fix.
xfail_strict = true

markers =
    validation: checked against a published reference value (textbook or standard)
    slow: takes more than a second

; Deliberately NOT turning warnings into errors yet -- scipy.integrate.quad
; is chatty on the DistributedRadialLoad paths. Tighten once that is clean.
